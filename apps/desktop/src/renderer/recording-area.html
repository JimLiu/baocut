<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 录制区域的选框（屏幕录制设计 §11 第 1 项）：只跑本地脚本，不连网。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>BaoCut</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body {
        font: 13px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        cursor: crosshair;
      }
      /* 没拖时整屏压暗；拖时由选框的外阴影压暗框外。 */
      .dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); }
      .sel {
        position: fixed;
        border: 1px solid #fff;
        outline: 1px solid rgba(0, 0, 0, 0.5);
        box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.35);
      }
      .size {
        position: fixed;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        pointer-events: none;
      }
      .hint {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        text-align: center;
        pointer-events: none;
      }
      .hint span { display: block; color: rgba(255, 255, 255, 0.7); margin-top: 2px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="dim" id="dim"></div>
    <div class="sel" id="sel" hidden></div>
    <div class="size" id="size" hidden></div>
    <div class="hint" id="hint" role="status"><strong id="hint-text"></strong><span id="hint-cancel"></span></div>
    <script type="module" src="./recording-area.ts"></script>
  </body>
</html>
