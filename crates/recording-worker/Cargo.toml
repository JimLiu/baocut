[package]
name = "recording-worker"
description = "BaoCut 的 Recording Worker（屏幕录制设计 §7）：采集屏幕、窗口或区域、系统声音、摄像头与麦克风，记录指针与（可选的）键盘；Runtime 以子进程调用，stdin/stdout 的 JSON 行。macOS 用 ScreenCaptureKit + AVFoundation；Windows 用 Windows.Graphics.Capture + WASAPI + Media Foundation（未经实机验证，缺省关闭）；别的平台回答「不支持」"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "recording_worker"
path = "src/lib.rs"

[[bin]]
name = "recording-worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Windows：屏幕、窗口与区域走 Windows.Graphics.Capture（D3D11 帧），麦克风与系统声音（回环）走 WASAPI，摄像头走
# Media Foundation 的 Source Reader，四路都由 Media Foundation 的 Sink Writer 写（H.264 与 AAC，分片 MP4）；指针、
# 光标图片与键盘走 Win32。用微软官方的 `windows` 绑定，版本对齐 `media-native` 的 0.62，不加第三方采集库。
# 采集只通过了交叉编译检查，没有在 Windows 上运行过：缺省不开放（`platform/windows/mod.rs`）。
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# 录制目录所在盘的剩余空间（`statvfs`）。
libc = "0.2"

# macOS：屏幕、窗口与系统声音走 ScreenCaptureKit，摄像头与麦克风走 AVCaptureSession，四路都由 AVAssetWriter
# 写（视频经 VideoToolbox 硬件编码成 H.264，音频 AAC）；指针位置与按键状态走 CoreGraphics 的事件源，光标图片走
# AppKit 的 `NSCursor`。版本对齐 `media-native` 已用的 objc2 系依赖，不新增大版本。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "SCError",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoDataOutput",
    "AVCaptureAudioDataOutput",
    "AVMediaFormat",
    "AVVideoSettings",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSettings"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFBase",
    "CFCGTypes",
    "CFString",
    "CFRunLoop",
    "CFMachPort",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGGeometry",
    "CGWindow",
    "libc",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMBase",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMSync",
    "CMTime",
    "objc2-core-audio-types",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSCursor",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSScreen",
    "objc2-core-foundation",
] }
