[package]
name = "credential-helper"
description = "BaoCut 的凭据助手：Runtime 以子进程调用，经 stdin/stdout 的一行 JSON 读写 macOS 钥匙串与 Windows Credential Manager（架构设计 §6.8）"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "credential_helper"
path = "src/lib.rs"

[[bin]]
name = "credential-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# macOS 钥匙串与 Windows Credential Manager；其他平台明确回答 unsupported。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
