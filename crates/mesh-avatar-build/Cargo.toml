[package]
name = "mesh-avatar-build"
description = "mesh-avatar 的制作工具：从一张立绘切出眼睛分层、补皮肤的底图与头发遮罩，导入画好的闭眼与口型变体，再按配音渲染会说话的主播视频；算法移植自 mesh-avatar-studio 的 Python 工具（MIT），见 README.md"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "mesh_avatar_build"
path = "src/lib.rs"

[[bin]]
name = "mesh-avatar-build"
path = "src/bin/mesh-avatar-build.rs"

[[bin]]
name = "mesh-avatar-talk"
path = "src/bin/mesh-avatar-talk.rs"

[dependencies]
anyhow = "1.0.102"
hound = "3.5.1"
image = { version = "0.25", default-features = false, features = ["png"] }
mesh-avatar-core.workspace = true
mesh-avatar-wgpu.workspace = true
pollster = "1"
rayon = "1.10.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
