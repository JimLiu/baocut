[package]
name = "editor-wasm"
description = "界面与 Node 共用的纯语义 WASM 入口：字幕与翻译核心的句子派生与原文指纹、舞台的框、引擎的取值区间、元素的样式目录、已有转写的识别说话人、来源自带章节的解析与吸附（架构设计 §1.4、§6.6、§7.9、§13.6）"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
editor-semantics.workspace = true
motion.workspace = true
render-graph.workspace = true
speech-doc.workspace = true
speech-doc-bridge.workspace = true
timeline.workspace = true
video-model.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
