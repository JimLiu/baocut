[package]
name = "caption-gpu"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = ["webgpu"]
webgpu = ["compositor/gpu-webgpu", "wgpu/webgpu"]
webgl = ["compositor/gpu-webgl", "wgpu/webgl"]
[target.'cfg(target_arch = "wasm32")'.dependencies]
compositor = { workspace = true }
subtitle-render = { workspace = true, features = ["wasm-safe"] }
render-raster = { workspace = true, features = ["wasm-safe"] }
caption-scene = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }
