name: model-management-candidate

on:
  push:
    branches: [codex/qwen-model-management]
  workflow_dispatch:

permissions: {}

concurrency:
  group: model-management-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.fork == true && github.ref == 'refs/heads/codex/qwen-model-management'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      CI: true
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          targets: wasm32-unknown-unknown
      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake clang libclang-dev pkg-config
          npm ci
          npm --prefix designs/baocut ci
      - name: Typecheck all projects
        run: npm run typecheck
      - name: Build WASM for UI and Runtime contracts
        run: npm run build:wasm
      - name: Provider, model and UI regression tests
        run: |
          npm test -- --maxWorkers=2 packages/providers/src packages/models/src/model-selection.test.ts packages/models/src/model-service-store.test.ts packages/ui/src/model/models-cloud.test.ts packages/ui/src/model/models-probe.test.ts packages/ui/src/components/models/model-actions.test.ts
      - name: Rebuild and verify the prototype
        run: |
          npm --prefix designs/baocut run build
          npm --prefix designs/baocut test
          node designs/baocut/build/build.mjs --check
          node designs/baocut/_ds/adobe-spectrum-2/check-conformance.mjs --token-file designs/baocut/app/tokens.css designs/baocut/app/*.css designs/baocut/app/*.jsx designs/baocut/app/*.js
      - name: Save only verified prototype generated files
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          allowed = {'designs/baocut/index.html', 'designs/baocut/BaoCut.html', 'designs/baocut/BaoCutWeb.html', 'designs/baocut/Components.html', 'designs/baocut/app/model-home-templates-data.js'}
          assert all(p in allowed or p.startswith('designs/baocut/generated/') for p in paths), 'Unexpected source modifications during verification'
          if paths:
              subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -c core.hooksPath=/dev/null commit -m 'build(prototype): sync verified model management assets'
            gh auth setup-git
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          targets: wasm32-unknown-unknown
      - name: Check native runner and Metal
        run: |
          test "$(uname -m)" = arm64
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal
      - name: Install build dependencies
        run: |
          npm ci
          brew install ffmpeg
      - name: Package an ad-hoc signed DMG without release credentials
        run: npm run package:mac -- --local --target aarch64-apple-darwin --out "$RUNNER_TEMP/baocut-candidate"
      - name: Prepare candidate artifact
        env:
          EXPECTED_SOURCE: ${{ needs.verify.outputs.source_sha }}
          OUTPUT: ${{ runner.temp }}/baocut-candidate
          DELIVERY: ${{ runner.temp }}/baocut-dmg
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['OUTPUT'])
          destination = pathlib.Path(os.environ['DELIVERY'])
          destination.mkdir()
          report = json.loads((root / 'app-release.json').read_text())
          assert report['sourceCommit'] == os.environ['EXPECTED_SOURCE']
          assert report.get('local') and not report.get('notarized')
          for file in root.glob('*.dmg*'):
              if file.is_file(): shutil.copy2(file, destination / file.name)
          assert len(list(destination.glob('*.dmg'))) == 1
          report.pop('verifiedApp', None)
          report['candidateRunUrl'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          (destination / 'app-release.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: baocut-model-management-macos-arm64
          path: ${{ runner.temp }}/baocut-dmg/*
          if-no-files-found: error
          retention-days: 7
