name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-tests:
    name: TypeScript tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # action 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install ffmpeg (media probe / export tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install npm dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build WASM required by UI and Runtime tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/baocut-target
        run: npm run build:wasm
      - name: Prebuild web client (web-service.test.ts requires dist output)
        run: npm run build:web
      - name: Build slides editor and compiler for slide validation tests
        run: npm run build:slides-editor
      - name: Run Vitest suite (unit + Runtime e2e)
        run: npm test

  composition-host-windows:
    name: Windows composition host
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - name: Test socket lifecycle and real Electron rendering after stdin closes
        run: node node_modules/vitest/vitest.mjs run --maxWorkers=1 packages/process-host/src/json-line-worker.test.ts packages/code-runtime/src/composition-host.test.ts apps/desktop/src/main/composition-host-entry.test.ts

  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install system dependencies (ffmpeg, cmake, libclang)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake clang libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # action 1.97.1
      # TODO: re-enable `cargo fmt --all -- --check` once the whole tree has been
      # reformatted with the current rustfmt. Right now ~20 source blocks are
      # drifting, which would mask real test/typecheck failures on every PR.
      - name: Rust workspace tests (locked)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/baocut-target
        run: cargo test --locked --workspace
