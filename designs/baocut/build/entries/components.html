<style>
  body { background: var(--gray-100); }
  .pg-wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
  .pg-hd { margin-bottom: 24px; }
  .sec { margin-top: 32px; padding: 20px; border-radius: 10px; background: var(--gray-25); box-shadow: inset 0 0 0 1px var(--gray-200); }
  .sec > h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; color: var(--gray-900); }
  .sec > .note { margin: 0 0 16px; font-size: 12px; color: var(--gray-600); line-height: 1.5; }
  .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .strip + .strip { margin-top: 12px; }
  .grid-ic { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .ic-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 8px; background: var(--gray-50); }
  .ic-cell span { font-size: 10px; color: var(--gray-600); }
  .ic-cell em { font-size: 10px; font-style: normal; color: var(--gray-500); }
  .ramp { display: flex; flex-wrap: wrap; gap: 4px; }
  .sw-cell { width: 76px; }
  .sw-chip { height: 32px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .sw-cell span { display: block; margin-top: 4px; font-size: 10px; color: var(--gray-600); font-family: var(--mono); }
</style>
